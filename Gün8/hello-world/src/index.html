<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gün 8</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module" src="../dist/index.js"></script>
</head>
<body class="min-h-screen bg-slate-100 text-slate-900">
    <main class="mx-auto max-w-6xl px-4 py-8 sm:px-6 lg:px-8">
        <header class="mb-8">
            <h1 class="mt-2 text-3xl font-bold tracking-tight text-slate-950">Dersler ve Öğretmenler</h1>
        </header>

        <div class="grid gap-6 lg:grid-cols-[1.4fr_1fr]">
            <section class="rounded-2xl bg-white p-5 shadow-sm ring-1 ring-slate-200 sm:p-6" aria-labelledby="dersler-baslik">
                <div class="mb-5 flex items-center justify-between gap-4">
                    <h2 id="dersler-baslik" class="text-xl font-semibold text-slate-950">Tüm dersler</h2>
                    <span id="tum-ders-sayisi" class="rounded-full bg-indigo-50 px-3 py-1 text-sm font-medium text-indigo-700">5 ders</span>
                </div>
                <div id="ders-listesi" class="grid gap-4 sm:grid-cols-2"></div>
            </section>

            <aside class="space-y-6"> <!-- aside elementi, seçilen dersler ve öğretmen mesajı için iki bölüm içerir -->
                <section class="rounded-2xl bg-white p-5 shadow-sm ring-1 ring-slate-200 sm:p-6" aria-labelledby="secilen-dersler-baslik">
                    <div class="mb-5 flex items-center justify-between gap-4">
                        <h2 id="secilen-dersler-baslik" class="text-xl font-semibold text-slate-950">Seçilen dersler</h2>
                        <span id="secilen-ders-sayisi" class="rounded-full bg-emerald-50 px-3 py-1 text-sm font-medium text-emerald-700">0</span>
                    </div>
                    <div id="secilen-dersler" class="space-y-3"></div>
                </section>
                <!-- Öğretmen mesajı bölümü-->
                <section class="rounded-2xl bg-slate-900 p-5 text-white shadow-sm sm:p-6" aria-labelledby="mesaj-baslik">
                    <h2 id="mesaj-baslik" class="text-lg font-semibold">Öğretmen mesajı:</h2>
                    <p id="ogretmen-mesaji" class="mt-3 min-h-12 text-slate-300">Öğretmenle konuşmak için sohbet balonuna tıklayın.</p>
                </section>
            </aside>
        </div>
    </main>

    <template id="ders-karti"><!-- ders kartı şablonu -->
        <article class="flex items-center justify-between gap-4 rounded-xl border border-slate-200 p-4 shadow-sm">
            <div>
                <p class="ders-adi text-lg font-semibold text-slate-950"></p>
                <p class="ders-ogretmeni mt-1 text-sm text-slate-600"></p>
            </div>
            <div class="flex shrink-0 items-center gap-2">
                <button type="button" data-action="konus" class="sohbet-butonu rounded-full p-2 text-lg text-slate-600 hover:bg-slate-100" title="Öğretmenle konuş" aria-label="Öğretmenle konuş">💬</button>
                <button type="button" data-action="ekle" class="islem-butonu rounded-full bg-indigo-600 px-3 py-1 text-xl font-semibold text-white hover:bg-indigo-700" title="Dersi seç" aria-label="Dersi seç">+</button>
            </div>
        </article>
    </template>
</body>
</html>
