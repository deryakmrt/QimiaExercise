<!doctype html>
<html lang="tr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gün 6</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
    <script type="module" src="../dist/index.js" defer></script>
</head>

<body>
    <main class="bg-green-300 min-h-screen flex items-center justify-center p-4">
        <div class="login-container bg-white rounded-sm shadow-lg w-full max-w-sm overflow-hidden">
            <form id="login-form" action="#" method="POST" novalidate>
                <h1 class="text-center text-3xl font-bold text-white bg-green-700 py-5 w-full">
                    Login Form
                </h1>
                <div class="p-8">
                    <!-- mail alanı -->
                    <div class="input-group flex items-stretch mb-2">
                        <span class="bg-green-700 text-white flex items-center justify-center w-11 rounded-l"
                            aria-hidden="true"><i class="bi bi-person-fill"></i></span>
                        <input type="email" id="email" name="email" required placeholder="E-mail or Phone"
                            autocomplete="email"
                            class="border border-gray-300 rounded-r px-3 py-2 w-full focus:outline-none focus:border-green-700" />
                    </div>
                    <p id="email-error" class="text-red-600 text-xs min-h-5 mb-3" role="alert"></p>

                    <!-- şifre alanı -->
                    <div class="input-group flex items-stretch mb-2">
                        <span class="bg-green-700 text-white flex items-center justify-center w-11 rounded-l"
                            aria-hidden="true"><i class="bi bi-lock-fill"></i></span>
                        <input type="password" id="password" name="password" required minlength="8"
                            placeholder="Password" autocomplete="current-password"
                            class="border border-gray-300 rounded-r px-3 py-2 w-full focus:outline-none focus:border-green-700" />
                    </div>
                    <p id="password-error" class="text-red-600 text-xs min-h-5 mb-3" role="alert"></p>

                    <p class="text-sm text-gray-600 mb-3">
                        <a href="#"  class="text-green-500 hover:text-gray-700">Forgot your password?</a>
                    </p>

                    <!-- login butonu -->
                    <button type="submit"
                        class="login-btn bg-green-700 hover:bg-green-600 text-white font-bold py-3 rounded block mx-auto w-full">
                        Login
                    </button>
                    <p id="login-message" class="text-center text-sm min-h-5 mt-4" role="status"></p>
                    <p class="text-center text-sm text-gray-600 mt-3">
                        Not a member?
                        <a href="#" class="text-green-700 font-semibold hover:underline">Signup now</a>
                    </p>
                </div>
            </form>
        </div>
    </main>
</body>

</html>
