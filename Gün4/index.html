<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gün 5</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
    <script src="index.js" ></script>
    <script src="components.js" ></script>
  </head>

  <body>
    <main class="max-w-6xl mx-auto px-6 py-12">

      <!-- Tab bölümü -->
      <div class="flex justify-center gap-8 border-b border-gray-200">
        <button type="button" class="tab-btn relative w-fit pb-4" data-tab="expertise">
          <span class="tab-label text-2xl text-gray-400">Expertise</span>
          <div class="tab-underline absolute -bottom-px left-0 right-0 h-1 rounded-full bg-linear-to-r from-blue-400 to-indigo-600 hidden"></div>
        </button>
        <button type="button" class="tab-btn relative w-fit pb-4" data-tab="how-we-work">
          <span class="tab-label text-2xl text-gray-400">How We Work</span>
          <div class="tab-underline absolute -bottom-px left-0 right-0 h-1 rounded-full bg-linear-to-r from-blue-400 to-indigo-600 hidden"></div>
        </button>
      </div>

      <!-- Kartların grid yapısı -->
      <div id="content-expertise" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 mt-10"></div>

      <div id="content-how-we-work" class="hidden grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 mt-10"></div>
    </main>
  </body>
</html>
