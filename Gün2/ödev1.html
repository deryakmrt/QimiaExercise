<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dairesel Grid</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="style3.css">
</head>
<body class="bg-light d-flex align-items-center min-vh-100 py-5">
    <div class="container">
        <div class="circle-grid mx-auto">
            
            <div class="badge-item" style="--x:35%; --y:10%;">
                <div class="circle-badge">
                    <i class="bi bi-gear-fill"></i>
                </div>
                <span class="badge-text">Workflow<br>Integration</span>
            </div>

            <div class="badge-item" style="--x:65%; --y:10%;">
                <div class="circle-badge">
                    <i class="bi bi-display"></i>
                </div>
                <span class="badge-text">Monitoring<br>& Evaluation</span>
            </div>

            <div class="badge-item" style="--x:15%; --y:35%;">
                <div class="circle-badge">
                    <i class="bi bi-gear-wide-connected"></i>
                </div>
                <span class="badge-text">Communication, Planning,<br>& Implementation</span>
            </div>

            <div class="badge-item" style="--x:50%; --y:42%;">
                <div class="circle-badge">
                    <i class="bi bi-bullseye"></i>
                </div>
                <span class="badge-text">Outcomes &<br>Effectiveness</span>
            </div>

            <div class="badge-item" style="--x:85%; --y:35%;">
                <div class="circle-badge">
                    <i class="bi bi-person-workspace"></i>
                </div>
                <span class="badge-text">Engaged Staff<br>& Leadership</span>
            </div>

            <div class="badge-item" style="--x:22%; --y:65%;">
                <div class="circle-badge">
                    <i class="bi bi-people-fill"></i>
                </div>
                <span class="badge-text">Engaged<br>Community</span>
            </div>

            <div class="badge-item" style="--x:78%; --y:65%;">
                <div class="circle-badge">
                    <i class="bi bi-speedometer2"></i>
                </div>
                <span class="badge-text">Organizational<br>Context & Capacity</span>
            </div>

            <div class="badge-item" style="--x:50%; --y:85%;">
                <div class="circle-badge">
                    <span class="currency-icon">$</span>
                </div>
                <span class="badge-text">Funding<br>Stability</span>
            </div>
        </div>
    </div>
    
</body>
</html>
